<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cảnh báo</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            animation: flicker 0.5s infinite alternate;
        }

        .warning {
            font-size: 4vw;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 20px #ff0000;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.6; transform: scale(0.95); }
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .skull {
            font-size: 8vw;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="warning">
        <div class="skull">☠☠☠</div>
        <div>Bạn đã bị chuyển hướng</div>
        <div>đến web độc hại</div>
    </div>
</body>
</html>
